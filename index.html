<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1217" />
    <title>BlockDown</title>
    <!-- Ikon aplikasi menunggu arahan pemilik (DESIGN 10, ROADMAP Fase 5). Baris ini mencegah permintaan favicon.ico. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <!-- ================= MENU ================= -->
      <section id="scr-menu" class="screen menu" hidden>
        <div class="menu-top">
          <div class="seg" role="group" data-i18n-aria="menu.language">
            <button type="button" class="seg-btn" data-locale="id" aria-pressed="true">ID</button>
            <button type="button" class="seg-btn" data-locale="en" aria-pressed="false">EN</button>
          </div>
          <button type="button" class="btn btn-small" id="btn-settings">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#settings" /></svg>
            <span data-i18n="menu.settings"></span>
          </button>
        </div>

        <h1 class="logo" data-i18n-aria="a11y.logo">
          <span aria-hidden="true">BlockD</span><span class="logo-block" aria-hidden="true"></span><span aria-hidden="true">wn</span>
        </h1>

        <div class="modes">
          <button type="button" class="mode-row" id="mode-marathon" aria-expanded="false" aria-controls="marathon-variants">
            <span class="mode-text">
              <span class="mode-name" data-i18n="mode.marathon.name"></span>
              <span class="mode-desc" data-i18n="mode.marathon.desc"></span>
            </span>
          </button>
          <div class="mode-variants" id="marathon-variants" hidden>
            <button type="button" class="mode-row variant" data-mode="marathon150">
              <span class="mode-name" data-i18n="menu.marathon150"></span>
              <span class="mode-record">
                <span class="record-label" data-i18n="menu.record"></span>
                <span class="record-value num" data-record="marathon150"></span>
              </span>
            </button>
            <button type="button" class="mode-row variant" data-mode="marathonEndless">
              <span class="mode-name" data-i18n="menu.marathonEndless"></span>
              <span class="mode-record">
                <span class="record-label" data-i18n="menu.record"></span>
                <span class="record-value num" data-record="marathonEndless"></span>
              </span>
            </button>
          </div>
          <button type="button" class="mode-row" data-mode="sprint40">
            <span class="mode-text">
              <span class="mode-name" data-i18n="mode.sprint40.name"></span>
              <span class="mode-desc" data-i18n="mode.sprint40.desc"></span>
            </span>
            <span class="mode-record">
              <span class="record-label" data-i18n="menu.record"></span>
              <span class="record-value num" data-record="sprint40"></span>
            </span>
          </button>
          <button type="button" class="mode-row" data-mode="ultra">
            <span class="mode-text">
              <span class="mode-name" data-i18n="mode.ultra.name"></span>
              <span class="mode-desc" data-i18n="mode.ultra.desc"></span>
            </span>
            <span class="mode-record">
              <span class="record-label" data-i18n="menu.record"></span>
              <span class="record-value num" data-record="ultra"></span>
            </span>
          </button>
          <button type="button" class="mode-row" data-mode="zen">
            <span class="mode-text">
              <span class="mode-name" data-i18n="mode.zen.name"></span>
              <span class="mode-desc" data-i18n="mode.zen.desc"></span>
            </span>
            <span class="mode-record">
              <span class="record-label" data-i18n="menu.record"></span>
              <span class="record-value num" data-record="zen"></span>
            </span>
          </button>
          <p class="notice" id="menu-notice" hidden></p>
        </div>

        <!-- Hanya tampil di perangkat dengan keyboard/mouse; isinya mengikuti pemetaan tombol. -->
        <section class="controls" aria-labelledby="controls-title">
          <h2 id="controls-title" class="controls-title" data-i18n="menu.controlsTitle"></h2>
          <dl id="controls-list"></dl>
        </section>
      </section>

      <!-- ================= GAME ================= -->
      <section id="scr-game" class="screen game" hidden>
        <header class="game-top">
          <span class="game-mode" id="hud-mode"></span>
          <div class="score-box">
            <span class="hud-label" data-i18n="hud.score"></span>
            <output class="num score" id="hud-score">0</output>
          </div>
          <button type="button" class="icon-btn" id="btn-pause" data-i18n-aria="hud.pause">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#pause" /></svg>
          </button>
        </header>

        <!-- Statistik dalam satu baris di bawah skor; Waktu dan Combo muncul hanya saat relevan. -->
        <dl class="stats">
          <div class="stat"><dt data-i18n="hud.level"></dt><dd class="num" id="hud-level">1</dd></div>
          <div class="stat"><dt data-i18n="hud.lines"></dt><dd class="num" id="hud-lines">0</dd></div>
          <div class="stat" id="stat-time" hidden><dt data-i18n="hud.time"></dt><dd class="num" id="hud-time">0:00</dd></div>
          <div class="stat" id="stat-combo" hidden><dt data-i18n="hud.combo"></dt><dd class="num" id="hud-combo">0</dd></div>
        </dl>

        <!-- Simpan di kiri, Antrean 5 mendatar di kanan, tepat di atas papan. -->
        <div class="queue-row">
          <div class="queue-box">
            <span class="hud-label" data-i18n="hud.hold"></span>
            <div class="well"><canvas id="cv-hold" role="img"></canvas></div>
          </div>
          <div class="queue-box queue-next">
            <span class="hud-label" data-i18n="hud.next"></span>
            <div class="well"><canvas id="cv-next" role="img"></canvas></div>
          </div>
        </div>

        <!-- Seluruh area ini menerima gestur; jari boleh di luar papan supaya papan tidak tertutup. -->
        <div class="field" id="field">
          <!-- Pita ambient (DESIGN 8.1): cahaya 5% di belakang papan, warnanya mengikuti level. -->
          <div class="ambient" id="ambient" aria-hidden="true"></div>
          <div class="board" id="board">
            <canvas id="cv-bg" aria-hidden="true"></canvas>
            <canvas id="cv-stack" aria-hidden="true"></canvas>
            <canvas id="cv-main" role="img"></canvas>
            <!-- Cahaya momen besar sebagai lapisan CSS yang hanya dipudarkan dan diregangkan (murah di GPU). -->
            <div class="fx-flash" id="fx-flash" aria-hidden="true" hidden></div>
            <div class="fx-pillar" id="fx-pillar" aria-hidden="true" hidden></div>
            <!-- Bingkai naik level, digambar ulang dengan warna aksen. -->
            <div class="board-frame" id="board-frame" aria-hidden="true"></div>
            <!-- Callout reward di sepertiga atas papan (DESIGN 8.3). Diumumkan lewat #live, jadi disembunyikan dari pembaca layar. -->
            <div class="callout" id="callout" aria-hidden="true">
              <span class="callout-glow" id="callout-glow"></span>
              <span class="callout-points num" id="callout-points"></span>
              <span class="callout-title" id="callout-title"></span>
              <span class="callout-sub" id="callout-sub"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- ================= PENGATURAN ================= -->
      <section id="scr-settings" class="screen settings" hidden aria-labelledby="settings-title">
        <header class="settings-top">
          <button type="button" class="icon-btn" id="btn-settings-back" data-i18n-aria="settings.back">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#arrow_back" /></svg>
          </button>
          <h1 id="settings-title" data-i18n="settings.title"></h1>
        </header>

        <section class="set-group" aria-labelledby="g-controls">
          <h2 id="g-controls" data-i18n="settings.group.controls"></h2>

          <!-- Hanya di layar sentuh: penjelasan gestur, karena tidak ada tombol di layar. -->
          <div class="set-row touch-only">
            <div class="set-text">
              <span class="set-label" data-i18n="settings.gestures"></span>
              <span class="set-desc" data-i18n="settings.gestures.desc"></span>
            </div>
          </div>

          <div class="set-row">
            <div class="set-text">
              <label class="set-label" for="in-das" data-i18n="settings.das"></label>
              <span class="set-desc" data-i18n="settings.das.desc"></span>
            </div>
            <output class="num set-value" for="in-das" id="out-das"></output>
            <input type="range" id="in-das" min="50" max="300" step="1" />
          </div>

          <div class="set-row">
            <div class="set-text">
              <label class="set-label" for="in-arr" data-i18n="settings.arr"></label>
              <span class="set-desc" data-i18n="settings.arr.desc"></span>
            </div>
            <output class="num set-value" for="in-arr" id="out-arr"></output>
            <input type="range" id="in-arr" min="0" max="100" step="1" />
          </div>

          <div class="set-row">
            <div class="set-text">
              <label class="set-label" for="in-soft" data-i18n="settings.softDrop"></label>
              <span class="set-desc" data-i18n="settings.softDrop.desc"></span>
            </div>
            <output class="num set-value" for="in-soft" id="out-soft"></output>
            <!-- 1..8 = 5x..40x, 9 = Instan -->
            <input type="range" id="in-soft" min="1" max="9" step="1" />
          </div>

          <div class="set-row keys-row">
            <div class="set-text">
              <span class="set-label" id="lbl-keys" data-i18n="settings.keys"></span>
              <span class="set-desc" data-i18n="settings.keys.desc"></span>
            </div>
            <div class="keymap" id="keymap" role="group" aria-labelledby="lbl-keys"></div>
            <p class="set-help" id="keys-msg" role="status"></p>
          </div>

          <div class="set-row">
            <div class="set-text">
              <span class="set-label" data-i18n="settings.reset"></span>
              <span class="set-desc" data-i18n="settings.reset.desc"></span>
            </div>
            <button type="button" class="btn btn-small" id="btn-reset">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#restart_alt" /></svg>
              <span data-i18n="settings.reset"></span>
            </button>
          </div>
        </section>

        <section class="set-group" aria-labelledby="g-display">
          <h2 id="g-display" data-i18n="settings.group.display"></h2>
          <div class="set-row">
            <div class="set-text">
              <span class="set-label" id="lbl-ghost" data-i18n="settings.ghost"></span>
              <span class="set-desc" data-i18n="settings.ghost.desc"></span>
            </div>
            <button type="button" class="switch" role="switch" data-set="ghost" aria-labelledby="lbl-ghost"></button>
          </div>
          <div class="set-row">
            <div class="set-text">
              <span class="set-label" id="lbl-grid" data-i18n="settings.grid"></span>
              <span class="set-desc" data-i18n="settings.grid.desc"></span>
            </div>
            <button type="button" class="switch" role="switch" data-set="grid" aria-labelledby="lbl-grid"></button>
          </div>
          <div class="set-row">
            <div class="set-text">
              <span class="set-label" id="lbl-colorsafe" data-i18n="settings.colorSafe"></span>
              <span class="set-desc" data-i18n="settings.colorSafe.desc"></span>
            </div>
            <button type="button" class="switch" role="switch" data-set="colorSafe" aria-labelledby="lbl-colorsafe"></button>
          </div>
          <div class="set-row">
            <div class="set-text">
              <span class="set-label" id="lbl-effects" data-i18n="settings.effects"></span>
              <span class="set-desc" data-i18n="settings.effects.desc"></span>
            </div>
            <div class="seg" role="group" aria-labelledby="lbl-effects">
              <button type="button" class="seg-btn" data-set="effects" data-value="full" data-i18n="settings.effects.full"></button>
              <button type="button" class="seg-btn" data-set="effects" data-value="medium" data-i18n="settings.effects.medium"></button>
              <button type="button" class="seg-btn" data-set="effects" data-value="minimal" data-i18n="settings.effects.minimal"></button>
            </div>
            <p class="set-help" id="effects-locked" data-i18n="settings.effects.locked" hidden></p>
          </div>
          <div class="set-row">
            <div class="set-text">
              <span class="set-label" id="lbl-reduce" data-i18n="settings.reduceMotion"></span>
              <span class="set-desc" data-i18n="settings.reduceMotion.desc"></span>
            </div>
            <button type="button" class="switch" role="switch" data-set="reduceMotion" aria-labelledby="lbl-reduce"></button>
          </div>
          <div class="set-row">
            <div class="set-text">
              <span class="set-label" id="lbl-haptics" data-i18n="settings.haptics"></span>
              <span class="set-desc" id="haptics-desc" data-i18n="settings.haptics.desc"></span>
            </div>
            <button type="button" class="switch" role="switch" data-set="haptics" aria-labelledby="lbl-haptics" aria-describedby="haptics-desc"></button>
          </div>
        </section>

        <section class="set-group" aria-labelledby="g-sound">
          <h2 id="g-sound" data-i18n="settings.group.sound"></h2>
          <p class="set-help" id="audio-unavailable" data-i18n="notice.audioUnavailable" hidden></p>
          <div class="set-row">
            <div class="set-text">
              <label class="set-label" for="in-music" data-i18n="settings.music"></label>
            </div>
            <output class="num set-value" for="in-music" id="out-music"></output>
            <input type="range" id="in-music" min="0" max="100" step="5" />
          </div>
          <div class="set-row">
            <div class="set-text">
              <label class="set-label" for="in-sfx" data-i18n="settings.sfx"></label>
            </div>
            <output class="num set-value" for="in-sfx" id="out-sfx"></output>
            <input type="range" id="in-sfx" min="0" max="100" step="5" />
          </div>
        </section>

        <section class="set-group" aria-labelledby="g-lang">
          <h2 id="g-lang" data-i18n="settings.group.language"></h2>
          <div class="set-row">
            <span class="set-label" id="lbl-lang" data-i18n="settings.language"></span>
            <div class="seg" role="group" aria-labelledby="lbl-lang">
              <button type="button" class="seg-btn" data-locale="id" data-i18n="settings.language.id"></button>
              <button type="button" class="seg-btn" data-locale="en" data-i18n="settings.language.en"></button>
            </div>
          </div>
        </section>

        <p class="notice" id="settings-notice" hidden></p>
      </section>
    </main>

    <dialog id="dlg-pause" class="panel" aria-labelledby="pause-title">
      <h2 id="pause-title" data-i18n="pause.title"></h2>
      <div class="actions">
        <button type="button" class="btn btn-primary" data-act="resume" autofocus>
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#play_arrow" /></svg>
          <span data-i18n="pause.resume"></span>
        </button>
        <button type="button" class="btn" data-act="end" id="btn-end" hidden>
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#flag" /></svg>
          <span data-i18n="pause.end"></span>
        </button>
        <button type="button" class="btn" data-act="restart">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#replay" /></svg>
          <span data-i18n="pause.restart"></span>
        </button>
        <button type="button" class="btn" data-act="settings">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#tune" /></svg>
          <span data-i18n="pause.settings"></span>
        </button>
        <button type="button" class="btn" data-act="menu">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#home" /></svg>
          <span data-i18n="pause.menu"></span>
        </button>
      </div>
      <div class="panel-foot">
        <span data-i18n="pause.sessionTime"></span>
        <span class="num" id="pause-time"></span>
      </div>
    </dialog>

    <dialog id="dlg-confirm" class="panel" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <h2 id="confirm-title" data-i18n="confirm.title"></h2>
      <p id="confirm-body" class="panel-text" data-i18n="confirm.body"></p>
      <div class="actions">
        <button type="button" class="btn" data-act="cancel" autofocus data-i18n="confirm.cancel"></button>
        <button type="button" class="btn btn-primary" data-act="ok" id="confirm-ok"></button>
      </div>
    </dialog>

    <dialog id="dlg-over" class="panel" aria-labelledby="over-title">
      <p class="over-mode" id="over-mode"></p>
      <h2 id="over-title"></h2>
      <div class="over-result">
        <span class="hud-label" id="over-result-label"></span>
        <span class="over-result-row">
          <span class="num over-value" id="over-value"></span>
          <span class="tag" id="over-new" hidden data-i18n="over.newRecord"></span>
        </span>
      </div>
      <dl class="over-stats">
        <div id="over-score-row" hidden><dt data-i18n="hud.score"></dt><dd class="num" id="over-score"></dd></div>
        <div><dt data-i18n="over.statLevel"></dt><dd class="num" id="over-level"></dd></div>
        <div><dt data-i18n="over.statLines"></dt><dd class="num" id="over-lines"></dd></div>
        <div><dt data-i18n="over.statQuads"></dt><dd class="num" id="over-quads"></dd></div>
        <div><dt data-i18n="over.statTSpins"></dt><dd class="num" id="over-tspins"></dd></div>
        <div><dt data-i18n="over.statMaxCombo"></dt><dd class="num" id="over-combo"></dd></div>
      </dl>
      <p class="notice" id="over-notice" hidden></p>
      <div class="actions">
        <button type="button" class="btn btn-primary" data-act="again" autofocus>
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#replay" /></svg>
          <span data-i18n="over.playAgain"></span>
        </button>
        <button type="button" class="btn" data-act="menu">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#home" /></svg>
          <span data-i18n="over.menu"></span>
        </button>
      </div>
    </dialog>

    <!-- Layar sentuh dalam posisi mendatar: permainan hanya tegak. Di luar #app karena #app disembunyikan. -->
    <div class="rotate-notice" id="rotate-notice" role="alert">
      <svg class="icon" aria-hidden="true"><use href="/icons.svg#screen_rotation" /></svg>
      <p class="rotate-title" data-i18n="rotate.title"></p>
      <p class="rotate-body" data-i18n="rotate.body"></p>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>
    <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
